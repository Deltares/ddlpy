---
name: test-mindeps

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['py310-mindeps']
        os: [ubuntu-latest] #, windows-latest]

    name: py-${{ matrix.python-version }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    concurrency:
      group: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.python-version }}-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v6
      - uses: prefix-dev/setup-pixi@v0.9.4
        with:
          pixi-version: "v0.70.2"
          environments: ${{ matrix.python-version }}

      - name: List env contents
        run: |
          pixi list -e ${{ matrix.python-version }}

      - name: Lint with flake8
        run: |
          pixi run flake8 .

      - name: Run tests
        run: |
          pixi run --locked -e ${{ matrix.python-version }} test -m "not requireslocaldata"

      - uses: codecov/codecov-action@v4
        env:
          CODECOV_TOKEN: ${{secrets.CODECOV_TOKEN}}
